<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="hotel-ixmiquilpan.png">
    <title>Hotel Dios Padre | Login</title>
    <link rel="stylesheet" href="styles1.css" />
  </head>

  <body>
    <main class="login-wrapper">
      <div class="login-container">
        
        <!-- Lado Izquierdo: Imagen Panorámica del Balneario -->
        <div class="login-hero-image"></div>

        <!-- Lado Derecho: Formulario de inicio de sesión -->
        <div class="login-form-section">
          <form id="loginForm" class="card">
            
            <img src="hotel-ixmiquilpan.png" alt="Logo Hotel" class="card-logo" />

            <h2>Iniciar sesión</h2>

            <label>
              Tipo de acceso
              <select id="tipo">
                <option value="Administrador">Administrador</option>
                <option value="Camarista">Camarista</option>
                <option value="Taquilla">Taquilla</option>
              </select>
            </label>

            <label>
              Usuario
              <input id="usuario" required autocomplete="username" />
            </label>

            <label>
              Contraseña
              <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
              />
            </label>

            <button type="submit">Entrar</button>
            <p id="error"></p>
            
            <span class="copyright">© 2026 Dios Padre, Todos los derechos reservados. v1.0.0</span>
          </form>
        </div>

      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
